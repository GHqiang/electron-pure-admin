<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title>electron-pure-admin</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      window.process = {};
      // 关闭SECURITY警告 https://www.electronjs.org/zh/docs/latest/tutorial/security#%E9%9A%94%E7%A6%BB%E4%B8%8D%E5%8F%97%E4%BF%A1%E4%BB%BB%E7%9A%84%E5%86%85%E5%AE%B9
      window["ELECTRON_DISABLE_SECURITY_WARNINGS"] = true;
    </script>
  </head>

  <body>
    <script>
      // 辅助函数：补零
      function padZero(num) {
        return `0${num}`.slice(-2);
      }

      // 获取当前时间 YYYY-MM-DD HH:mm:ss
      function getCurrentTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = padZero(now.getMonth() + 1);
        const date = padZero(now.getDate());
        const hours = padZero(now.getHours());
        const minutes = padZero(now.getMinutes());
        const seconds = padZero(now.getSeconds());
        return `${year}-${month}-${date} ${hours}:${minutes}:${seconds}`;
      }

      class AsyncDelay {
        constructor() {
          // 创建 Worker 实例
          this.worker = new Worker("./worker.js");
          console.log('this.worker', this.worker)
          this.callbacks = {};
          this.callbackId = 0;
          this.worker.onmessage = this.handleMessage.bind(this);
        }

        handleMessage(event) {
          const { callbackId } = event.data;
          if (this.callbacks[callbackId]) {
            this.callbacks[callbackId]();
            // console.log('延迟结束:' + callbackId, getCurrentTime())
            delete this.callbacks[callbackId];
          }
        }

        async delay(ms) {

          return new Promise(resolve => {
            const callbackId = this.callbackId++;
            // console.log('开始执行延迟: '+ callbackId, getCurrentTime())
            this.callbacks[callbackId] = resolve;
            this.worker.postMessage({ delay: ms, callbackId });
          });
        }
      }

      // 使用示例
      const asyncDelay = new AsyncDelay();

      window.mockDelayHandle = (delayTime) => asyncDelay.delay(delayTime * 1000)
    </script>
    <div id="app">
      <style>
        html,
        body,
        #app {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }

        .loader,
        .loader::before,
        .loader::after {
          width: 2.5em;
          height: 2.5em;
          border-radius: 50%;
          animation: load-animation 1.8s infinite ease-in-out;
          animation-fill-mode: both;
        }

        .loader {
          position: relative;
          top: 0;
          margin: 80px auto;
          font-size: 10px;
          color: #406eeb;
          text-indent: -9999em;
          transform: translateZ(0);
          transform: translate(-50%, 0);
          animation-delay: -0.16s;
        }

        .loader::before,
        .loader::after {
          position: absolute;
          top: 0;
          content: "";
        }

        .loader::before {
          left: -3.5em;
          animation-delay: -0.32s;
        }

        .loader::after {
          left: 3.5em;
        }

        @keyframes load-animation {
          0%,
          80%,
          100% {
            box-shadow: 0 2.5em 0 -1.3em;
          }

          40% {
            box-shadow: 0 2.5em 0 0;
          }
        }
      </style>
      <div class="loader"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script src="https://g.alicdn.com/??/AWSC/AWSC/awsc.js,/sd/baxia-entry/baxiaCommon.js"></script>
  </body>
</html>
